

name: Build llama.cpp with Vulkan

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-vulkan.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev glslc spirv-headers
      - name: Clone repository
        run: git clone --depth 1 https://github.com/thecodacus/llama.cpp.git source
      - name: Configure
        run: cmake -S source -B source/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON
      - name: Compile
        run: cmake --build source/build --parallel 2
      - name: Package
        run: tar -czf llama.cpp-linux-vulkan-x64.tar.gz -C source/build bin
      - uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-linux-vulkan-x64
          path: llama.cpp-linux-vulkan-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod "https://vulkan.lunarg.com/sdk/latest/windows.txt").Trim()
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$version"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$version\Bin"
      - name: Clone repository
        shell: pwsh
        run: git clone --depth 1 https://github.com/thecodacus/llama.cpp.git source
      - name: Configure
        shell: pwsh
        run: cmake -S source -B source/build -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON
      - name: Compile
        shell: pwsh
        run: cmake --build source/build --config Release --parallel 2
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path source/build/bin -DestinationPath llama.cpp-windows-vulkan-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-windows-vulkan-x64
          path: llama.cpp-windows-vulkan-x64.zip
          if-no-files-found: error
