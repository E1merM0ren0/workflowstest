name: Build llama.cpp with Vulkan Support

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: thecodacus/llama.cpp
          path: llama.cpp
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Setup Vulkan SDK
        run: |
          $vulkanSdkUrl = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          $installerPath = "$env:TEMP\vulkan-sdk.exe"
          
          Write-Host "Downloading Vulkan SDK..."
          Invoke-WebRequest -Uri $vulkanSdkUrl -OutFile $installerPath
          
          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          
          $vulkanPath = "C:\VulkanSDK\*"
          $env:VULKAN_SDK = (Get-ChildItem $vulkanPath | Select-Object -First 1).FullName
          
          echo "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
          echo "$env:VULKAN_SDK\Bin" >> $env:GITHUB_PATH
          
          Write-Host "Vulkan SDK installed at: $env:VULKAN_SDK"

      - name: Configure CMake
        run: |
          cd llama.cpp
          cmake -B build -S . -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cd llama.cpp
          cmake --build build --config Release --parallel 4

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-windows-vulkan
          path: |
            llama.cpp/build/bin/Release/*.exe
            llama.cpp/build/bin/Release/*.dll
          retention-days: 7

#==========================================================================
