
name: Build llama.cpp with Vulkan Support

# ============================================================
# SHARED DEFAULT CONFIGURATION
# Change these defaults in one place.
# ============================================================
env:
  LLAMA_CPP_REPOSITORY: ggml-org/llama.cpp
  LLAMA_CPP_REF: master

on:
  workflow_dispatch:
    inputs:
      repository_source:
        description: "Choose one repository or build all repositories"
        type: choice
        options:
          - all
          - env
          - ggml-org/llama.cpp
          - thecodacus/llama.cpp
          - TheTom/llama-cpp-turboquant
          - manual
        default: all
        required: true

      repository:
        description: "Manual repository (owner/repository), used with manual"
        type: string
        default: ""
        required: false

      ref_source:
        description: "Choose how to select the branch/ref"
        type: choice
        options:
          - default
          - env
          - manual
        default: default
        required: true

      ref:
        description: "Manual branch, tag, or commit SHA"
        type: string
        default: ""
        required: false

  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # RESOLVE REPOSITORIES
  # Selects repositories, refs, and artifact filename slugs.
  # ============================================================
  resolve:
    name: Resolve Build Configuration
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
      - name: Resolve Repository Matrix
        id: resolve
        shell: bash
        env:
          REPOSITORY_SOURCE: ${{ inputs.repository_source || 'all' }}
          MANUAL_REPOSITORY: ${{ inputs.repository }}
          REF_SOURCE: ${{ inputs.ref_source || 'default' }}
          MANUAL_REF: ${{ inputs.ref }}
          DEFAULT_REPOSITORY: ${{ env.LLAMA_CPP_REPOSITORY }}
          DEFAULT_REF: ${{ env.LLAMA_CPP_REF }}
        run: |
          set -euo pipefail

          declare -a repositories=()

          case "$REPOSITORY_SOURCE" in
            all)
              repositories=(
                "$DEFAULT_REPOSITORY"
                "thecodacus/llama.cpp"
                "TheTom/llama-cpp-turboquant"
              )
              ;;
            env)
              repositories=("$DEFAULT_REPOSITORY")
              ;;
            manual)
              if [[ -z "$MANUAL_REPOSITORY" ]]; then
                echo "::error::Enter a repository when selecting manual."
                exit 1
              fi
              repositories=("$MANUAL_REPOSITORY")
              ;;
            ggml-org/llama.cpp|thecodacus/llama.cpp|TheTom/llama-cpp-turboquant)
              repositories=("$REPOSITORY_SOURCE")
              ;;
            *)
              echo "::error::Unknown repository selection."
              exit 1
              ;;
          esac

          # Remove duplicate repository entries.
          declare -A seen=()
          unique_repositories=()

          for repo in "${repositories[@]}"; do
            if [[ ! "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::Invalid repository format: $repo"
              exit 1
            fi

            if [[ -z "${seen[$repo]+x}" ]]; then
              seen["$repo"]=1
              unique_repositories+=("$repo")
            fi
          done

          # Build the matrix JSON. When ref_source=default,
          # discover each repository's own default branch.
          matrix='[]'

          for repo in "${unique_repositories[@]}"; do
            case "$REF_SOURCE" in
              env)
                branch="$DEFAULT_REF"
                ;;
              manual)
                if [[ -z "$MANUAL_REF" ]]; then
                  echo "::error::Enter a ref when selecting manual."
                  exit 1
                fi
                branch="$MANUAL_REF"
                ;;
              default)
                branch="$(curl -fsSL \
                  --retry 3 \
                  "https://api.github.com/repos/$repo" \
                  | jq -er '.default_branch')" || {
                    echo "::error::Could not determine the default branch for $repo"
                    exit 1
                  }
                ;;
              *)
                echo "::error::Unknown ref selection."
                exit 1
                ;;
            esac

            # Produce a filesystem-friendly repository identifier.
            slug="$(printf '%s' "$repo" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9-]/-/g; s/-\+/-/g; s/^-//; s/-$//')"

            entry="$(jq -cn \
              --arg repository "$repo" \
              --arg ref "$branch" \
              --arg slug "$slug" \
              '{repository:$repository, ref:$ref, slug:$slug}')"

            matrix="$(jq -cn \
              --argjson current "$matrix" \
              --argjson entry "$entry" \
              '$current + [$entry]')"

            echo "Selected: $repo @ $branch"
          done

          if [[ "$matrix" == "[]" ]]; then
            echo "::error::No repositories were selected."
            exit 1
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $matrix"

  # ============================================================
  # WINDOWS BUILD
  # Builds every selected repository on Windows.
  # ============================================================
  build-windows:
    name: Windows Vulkan - ${{ matrix.slug }}
    runs-on: windows-latest
    needs: resolve

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: llama.cpp
          submodules: recursive

      - name: Setup Vulkan SDK
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"

          $ver = "1.4.313.2"
          $installerPath = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan-sdk.exe"

          Write-Host "Downloading Vulkan SDK $ver..."
          curl.exe -fL --retry 3 --retry-delay 5 -o $installerPath $url

          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK download failed with exit code $LASTEXITCODE"
          }

          Write-Host "Installing Vulkan SDK $ver..."
          & $installerPath --accept-licenses --default-answer --confirm-command install

          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installer failed with exit code $LASTEXITCODE"
          }

          $sdkPath = "C:\VulkanSDK\$ver"

          if (-not (Test-Path "$sdkPath\Bin\glslc.exe")) {
            throw "glslc.exe was not found at $sdkPath\Bin\glslc.exe"
          }

          "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdkPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S llama.cpp -B llama.cpp/build `
            -DGGML_VULKAN=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build llama.cpp/build --config Release --parallel 4

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = "llama.cpp/build/bin/Release"

          if (-not (Test-Path $buildDir)) {
            $buildDir = "llama.cpp/build/bin"
          }

          if (-not (Test-Path $buildDir)) {
            throw "Build output directory was not found."
          }

          $files = Get-ChildItem $buildDir -File -Recurse |
            Where-Object { $_.Extension -in @(".exe", ".dll") }

          if (-not $files) {
            throw "No Windows executables or DLLs were found."
          }

          $stageDir = "windows-release-stage"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          $rootPath = (Resolve-Path $buildDir).Path

          foreach ($file in $files) {
            $relativePath = $file.FullName.Substring(
              $rootPath.Length
            ).TrimStart('\', '/')

            $destination = Join-Path $stageDir $relativePath
            $destinationDir = Split-Path $destination -Parent

            New-Item -ItemType Directory -Path $destinationDir -Force | Out-Null
            Copy-Item $file.FullName $destination -Force
          }

          $archive = "llama-cpp-${{ matrix.slug }}-windows-vulkan.zip"

          Compress-Archive `
            -Path "$stageDir\*" `
            -DestinationPath $archive `
            -Force

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-${{ matrix.slug }}-windows-vulkan
          path: llama-cpp-${{ matrix.slug }}-windows-vulkan.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # LINUX BUILD
  # Builds every selected repository on Linux.
  # ============================================================
  build-linux:
    name: Linux Vulkan - ${{ matrix.slug }}
    runs-on: ubuntu-latest
    needs: resolve

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: llama.cpp
          submodules: recursive

      - name: Install Vulkan Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            libvulkan-dev \
            vulkan-tools \
            vulkan-validationlayers \
            spirv-tools \
            spirv-headers \
            glslc

      - name: Locate SPIRV-Headers CMake Configuration
        working-directory: llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          SPIRV_HEADERS_CONFIG="$(dpkg -L spirv-headers \
            | grep -m1 '/SPIRV-HeadersConfig.cmake$' || true)"

          if [ -z "$SPIRV_HEADERS_CONFIG" ]; then
            echo "::error::SPIRV-HeadersConfig.cmake was not found."
            dpkg -L spirv-headers
            exit 1
          fi

          SPIRV_HEADERS_DIR="$(dirname "$SPIRV_HEADERS_CONFIG")"
          echo "SPIRV_HEADERS_DIR=$SPIRV_HEADERS_DIR" >> "$GITHUB_ENV"

      - name: Configure CMake
        working-directory: llama.cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DSPIRV-Headers_DIR="${SPIRV_HEADERS_DIR}"

      - name: Build Project
        working-directory: llama.cpp
        run: |
          cmake --build build --parallel 4

      - name: Package Linux Release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-stage

          if [ -d llama.cpp/build/bin ]; then
            cp -a llama.cpp/build/bin release-stage/
          fi

          if [ -d llama.cpp/build/lib ]; then
            cp -a llama.cpp/build/lib release-stage/
          fi

          if [ -z "$(find release-stage -type f -print -quit)" ]; then
            echo "::error::No Linux build output files were found."
            exit 1
          fi

          archive="llama-cpp-${{ matrix.slug }}-linux-vulkan.tar.gz"
          tar -czf "$archive" -C release-stage .

      - name: Upload Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-${{ matrix.slug }}-linux-vulkan
          path: llama-cpp-${{ matrix.slug }}-linux-vulkan.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # GITHUB RELEASE
  # Publishes every successfully built repository/platform package
  # when a version tag (v*) is pushed.
  # ============================================================
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Build Packages
        uses: actions/download-artifact@v4
        with:
          pattern: llama-cpp-*
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: llama.cpp Vulkan Build ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*
