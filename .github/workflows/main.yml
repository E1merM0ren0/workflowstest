name: build thecodacus llama.cpp (Vulkan)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of thecodacus/llama.cpp to build"
        required: false
        default: "perf"
      sdk_version:
        description: "Vulkan SDK version to install (Chocolatey package version)"
        required: false
        default: "1.4.363"
  schedule:
    - cron: "0 5 * * 1"

# 👇 REQUIRED: Grants the workflow permission to create releases/push to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      # 👇 REQUIRED: Checks out YOUR repo so the patch file is available
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the fork
        shell: pwsh
        run: |
          $ref = "${{ inputs.ref || 'perf' }}"
          git clone --depth 1 --branch $ref --recurse-submodules `
            https://github.com/thecodacus/llama.cpp.git thecodacus
          cd thecodacus
          $sha   = (git rev-parse HEAD).Trim()
          $short = (git rev-parse --short HEAD).Trim()
          $date  = (git log -1 --format=%cI).Trim()
          "THE_SHORT=$short" >> $env:GITHUB_ENV
          "THE_REF=$ref"     >> $env:GITHUB_ENV
          "THE_SHA=$sha"     >> $env:GITHUB_ENV
          Write-Host "ref=$ref sha=$short date=$date"
          git log -1 --oneline
          "repo=github.com/thecodacus/llama.cpp`nref=$ref`ncommit=$sha`ncommit_date=$date`nbuilt_by=github-actions`n" |
            Out-File -Encoding utf8 "fork-info.txt"

      - name: Apply flash-attn shader patch
        shell: pwsh
        run: |
          cd thecodacus
          $patch = Join-Path $Env:GITHUB_WORKSPACE ".github/patches/flash_attn_fix.patch"
          if (-not (Test-Path $patch)) { throw "Patch file not found: $patch" }
          git apply $patch
          Write-Host "✅ Patch applied"

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $sdk = "${{ inputs.sdk_version || '1.4.363' }}"
          choco install vulkan-sdk --version=$sdk -y --no-progress
          $dir = Get-ChildItem C:\VulkanSDK -Directory |
                 Sort-Object Name -Descending |
                 Select-Object -First 1
          if (-not $dir) { throw "Vulkan SDK directory not found under C:\VulkanSDK" }
          Write-Host "Vulkan SDK at $($dir.FullName)"
          "VULKAN_SDK=$($dir.FullName)" >> $env:GITHUB_ENV

      - name: Configure (MSVC + Ninja + Vulkan)
        env:
          VULKAN_SHADER_DEFINES: |
            -DFA_TYPE_Q1_0
            -DFA_TYPE_Q1_1
            -DFA_TYPE_Q2_0
            -DFA_TYPE_Q2_1
            -DFA_TYPE_Q3_0
            -DFA_TYPE_Q3_1
            -DFA_TYPE_Q4_0
            -DFA_TYPE_Q4_1
            -DFA_TYPE_Q5_0
            -DFA_TYPE_Q5_1
            -DFA_TYPE_Q6_0
            -DFA_TYPE_Q8_0
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" ^
            || call "%ProgramFiles%\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" ^
            || call "%ProgramFiles%\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set "CMAKE_ARGS=%VULKAN_SHADER_DEFINES%"
          cmake -S thecodacus -B build/thecodacus -G Ninja ^
                -DGGML_VULKAN=ON ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF ^
                -DVulkan_INCLUDE_DIR=%VULKAN_SDK%/Include ^
                -DVulkan_LIBRARY=%VULKAN_SDK%/Lib/vulkan-1.lib ^
                -DCMAKE_PREFIX_PATH=%VULKAN_SDK%/Lib/cmake ^
                %CMAKE_ARGS%

      - name: Build
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" ^
            || call "%ProgramFiles%\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" ^
            || call "%ProgramFiles%\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build "build/thecodacus" -j 4 --target llama-cli llama-server

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build/thecodacus/bin/*.exe out/ -ErrorAction SilentlyContinue
          Copy-Item build/thecodacus/bin/*.dll out/ -ErrorAction SilentlyContinue
          Copy-Item thecodacus/fork-info.txt out/ -ErrorAction SilentlyContinue
          Get-ChildItem out | Select-Object Name, Length

      - name: Sanity check
        shell: cmd
        run: out\llama-cli.exe --version

      # 👇 REPLACED: Publishes binaries permanently to GitHub Releases
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/*.dll
            out/fork-info.txt
          tag_name: thecodacus-vulkan-${{ env.THE_SHORT }}
          name: Vulkan Build ${{ env.THE_SHORT }}
          body: |
            Automated Vulkan build of thecodacus/llama.cpp.
            
            - **Source Commit:** `${{ env.THE_SHA }}`
            - **Branch/Ref:** `${{ env.THE_REF }}`
            - **Built by:** GitHub Actions
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
