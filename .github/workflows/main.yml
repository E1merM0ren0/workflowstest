  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: thecodacus/llama.cpp
          path: llama.cpp
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Install Vulkan Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            libvulkan-dev \
            vulkan-tools \
            vulkan-validationlayers \
            spirv-tools \
            spirv-headers \
            glslc

      - name: Locate SPIRV-Headers CMake Configuration
        working-directory: llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          SPIRV_HEADERS_CONFIG="$(dpkg -L spirv-headers \
            | grep -m1 '/SPIRV-HeadersConfig.cmake$' || true)"

          if [ -z "$SPIRV_HEADERS_CONFIG" ]; then
            echo "::error::SPIRV-HeadersConfig.cmake was not found."
            dpkg -L spirv-headers
            exit 1
          fi

          SPIRV_HEADERS_DIR="$(dirname "$SPIRV_HEADERS_CONFIG")"
          echo "SPIRV_HEADERS_DIR=$SPIRV_HEADERS_DIR" >> "$GITHUB_ENV"

          echo "Found SPIRV-Headers at: $SPIRV_HEADERS_DIR"

      - name: Configure CMake
        working-directory: llama.cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DSPIRV-Headers_DIR="${SPIRV_HEADERS_DIR}"

      - name: Build Project
        working-directory: llama.cpp
        run: |
          cmake --build build --parallel 4

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-linux-vulkan
          path: |
            llama.cpp/build/bin/*
            llama.cpp/build/lib/*
          if-no-files-found: error
          retention-days: 7
