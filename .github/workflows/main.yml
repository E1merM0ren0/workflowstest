
name: Build llama.cpp with Vulkan Support

# ============================================================
# SHARED DEFAULT CONFIGURATION
# Used when "env" is selected in the dropdowns.
# ============================================================
env:
  LLAMA_CPP_REPOSITORY: ggml-org/llama.cpp
  LLAMA_CPP_REF: master

on:
  workflow_dispatch:
    inputs:
      repository_source:
        description: "Choose the repository to build"
        type: choice
        options:
          - env
          - ggml-org/llama.cpp
          - thecodacus/llama.cpp
          - TheTom/llama-cpp-turboquant
          - manual
        default: env
        required: true

      repository:
        description: "Manual repository (owner/repository)"
        type: string
        default: ""
        required: false

      ref_source:
        description: "Choose the branch/ref source"
        type: choice
        options:
          - env
          - manual
        default: env
        required: true

      ref:
        description: "Manual branch, tag, or commit SHA"
        type: string
        default: ""
        required: false

  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # WINDOWS BUILD
  # ============================================================
  build-windows:
    name: Build Windows Vulkan
    runs-on: windows-latest

    steps:
      - name: Resolve Build Configuration
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY_SOURCE="${{ inputs.repository_source }}"
          MANUAL_REPOSITORY="${{ inputs.repository }}"
          REF_SOURCE="${{ inputs.ref_source }}"
          MANUAL_REF="${{ inputs.ref }}"

          case "$REPOSITORY_SOURCE" in
            env)
              REPOSITORY="${{ env.LLAMA_CPP_REPOSITORY }}"
              ;;
            manual)
              REPOSITORY="$MANUAL_REPOSITORY"
              ;;
            *)
              REPOSITORY="$REPOSITORY_SOURCE"
              ;;
          esac

          if [ -z "$REPOSITORY" ]; then
            echo "::error::Repository cannot be empty."
            exit 1
          fi

          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Repository must be in owner/repository format."
            exit 1
          fi

          if [ "$REF_SOURCE" = "manual" ]; then
            REF="$MANUAL_REF"
          else
            REF="${{ env.LLAMA_CPP_REF }}"
          fi

          if [ -z "$REF" ]; then
            echo "::error::Ref cannot be empty."
            exit 1
          fi

          {
            echo "LLAMA_CPP_REPOSITORY=$REPOSITORY"
            echo "LLAMA_CPP_REF=$REF"
          } >> "$GITHUB_ENV"

          echo "Selected repository: $REPOSITORY"
          echo "Selected ref: $REF"

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPOSITORY }}
          ref: ${{ env.LLAMA_CPP_REF }}
          path: llama.cpp
          submodules: recursive

      - name: Setup Vulkan SDK
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"

          $ver = "1.4.313.2"
          $installerPath = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan-sdk.exe"

          Write-Host "Downloading Vulkan SDK $ver..."
          curl.exe -fL --retry 3 --retry-delay 5 -o $installerPath $url

          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK download failed with exit code $LASTEXITCODE"
          }

          Write-Host "Installing Vulkan SDK $ver..."
          & $installerPath --accept-licenses --default-answer --confirm-command install

          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installer failed with exit code $LASTEXITCODE"
          }

          $sdkPath = "C:\VulkanSDK\$ver"

          if (-not (Test-Path "$sdkPath\Bin\glslc.exe")) {
            throw "glslc.exe was not found at $sdkPath\Bin\glslc.exe"
          }

          "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdkPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

          Write-Host "Vulkan SDK installed successfully at $sdkPath"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S llama.cpp -B llama.cpp/build `
            -DGGML_VULKAN=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build llama.cpp/build --config Release --parallel 4

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = "llama.cpp/build/bin/Release"

          if (-not (Test-Path $buildDir)) {
            $buildDir = "llama.cpp/build/bin"
          }

          if (-not (Test-Path $buildDir)) {
            throw "Build output directory was not found."
          }

          $files = Get-ChildItem $buildDir -File -Recurse |
            Where-Object { $_.Extension -in @(".exe", ".dll") }

          if (-not $files) {
            throw "No Windows executables or DLLs were found."
          }

          $stageDir = "windows-release-stage"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null

          $rootPath = (Resolve-Path $buildDir).Path

          foreach ($file in $files) {
            $relativePath = $file.FullName.Substring(
              $rootPath.Length
            ).TrimStart('\', '/')

            $destination = Join-Path $stageDir $relativePath
            $destinationDir = Split-Path $destination -Parent

            New-Item -ItemType Directory -Path $destinationDir -Force | Out-Null
            Copy-Item $file.FullName $destination -Force
          }

          Compress-Archive `
            -Path "$stageDir\*" `
            -DestinationPath "llama-cpp-windows-vulkan.zip" `
            -Force

      - name: Upload Windows Release Package
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-windows-vulkan
          path: llama-cpp-windows-vulkan.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # LINUX BUILD
  # ============================================================
  build-linux:
    name: Build Linux Vulkan
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Build Configuration
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY_SOURCE="${{ inputs.repository_source }}"
          MANUAL_REPOSITORY="${{ inputs.repository }}"
          REF_SOURCE="${{ inputs.ref_source }}"
          MANUAL_REF="${{ inputs.ref }}"

          case "$REPOSITORY_SOURCE" in
            env)
              REPOSITORY="${{ env.LLAMA_CPP_REPOSITORY }}"
              ;;
            manual)
              REPOSITORY="$MANUAL_REPOSITORY"
              ;;
            *)
              REPOSITORY="$REPOSITORY_SOURCE"
              ;;
          esac

          if [ -z "$REPOSITORY" ]; then
            echo "::error::Repository cannot be empty."
            exit 1
          fi

          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Repository must be in owner/repository format."
            exit 1
          fi

          if [ "$REF_SOURCE" = "manual" ]; then
            REF="$MANUAL_REF"
          else
            REF="${{ env.LLAMA_CPP_REF }}"
          fi

          if [ -z "$REF" ]; then
            echo "::error::Ref cannot be empty."
            exit 1
          fi

          {
            echo "LLAMA_CPP_REPOSITORY=$REPOSITORY"
            echo "LLAMA_CPP_REF=$REF"
          } >> "$GITHUB_ENV"

          echo "Selected repository: $REPOSITORY"
          echo "Selected ref: $REF"

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPOSITORY }}
          ref: ${{ env.LLAMA_CPP_REF }}
          path: llama.cpp
          submodules: recursive

      - name: Install Vulkan Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            libvulkan-dev \
            vulkan-tools \
            vulkan-validationlayers \
            spirv-tools \
            spirv-headers \
            glslc

      - name: Locate SPIRV-Headers CMake Configuration
        working-directory: llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          SPIRV_HEADERS_CONFIG="$(dpkg -L spirv-headers \
            | grep -m1 '/SPIRV-HeadersConfig.cmake$' || true)"

          if [ -z "$SPIRV_HEADERS_CONFIG" ]; then
            echo "::error::SPIRV-HeadersConfig.cmake was not found."
            dpkg -L spirv-headers
            exit 1
          fi

          SPIRV_HEADERS_DIR="$(dirname "$SPIRV_HEADERS_CONFIG")"
          echo "SPIRV_HEADERS_DIR=$SPIRV_HEADERS_DIR" >> "$GITHUB_ENV"

          echo "Found SPIRV-Headers at: $SPIRV_HEADERS_DIR"

      - name: Configure CMake
        working-directory: llama.cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DSPIRV-Headers_DIR="${SPIRV_HEADERS_DIR}"

      - name: Build Project
        working-directory: llama.cpp
        run: |
          cmake --build build --parallel 4

      - name: Package Linux Release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-stage

          if [ -d llama.cpp/build/bin ]; then
            cp -a llama.cpp/build/bin release-stage/
          fi

          if [ -d llama.cpp/build/lib ]; then
            cp -a llama.cpp/build/lib release-stage/
          fi

          if [ -z "$(find release-stage -type f -print -quit)" ]; then
            echo "::error::No Linux build output files were found."
            exit 1
          fi

          tar -czf llama-cpp-linux-vulkan.tar.gz -C release-stage .

      - name: Upload Linux Release Package
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-linux-vulkan
          path: llama-cpp-linux-vulkan.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # GITHUB RELEASE
  # Runs only when a v* tag is pushed.
  # ============================================================
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Build Packages
        uses: actions/download-artifact@v4
        with:
          pattern: llama-cpp-*
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: llama.cpp Vulkan Build ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/llama-cpp-linux-vulkan.tar.gz
            release-assets/llama-cpp-windows-vulkan.zip
