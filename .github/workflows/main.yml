name: Build llama.cpp with Vulkan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run the workflow manually from the Actions tab

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Explicitly targeting the requested fork
          repository: thecodacus/llama.cpp 
          submodules: recursive

      # --- LINUX SETUP ---
      - name: Install Vulkan & Build Tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libvulkan-dev vulkan-tools glslang-tools

      # --- WINDOWS SETUP ---
      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Install Vulkan SDK via Chocolatey
          choco install vulkan-sdk -y
          
          # Refresh environment variables so CMake can immediately find the Vulkan SDK
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          echo "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV

      # --- COMPILATION ---
      - name: Configure CMake
        shell: bash
        run: |
          # GGML_VULKAN=ON enables the Vulkan GPU backend
          cmake -B build -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        shell: bash
        run: |
          # Compile using all available cores
          cmake --build build --config Release --parallel

      # --- ARTIFACTS ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-vulkan-${{ matrix.os }}
          # Paths vary slightly between single-config (Linux) and multi-config (Windows) CMake generators
          path: |
            build/bin/
            build/bin/Release/
            build/Release/
          if-no-files-found: warn
