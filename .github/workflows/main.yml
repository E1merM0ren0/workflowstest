name: Build llama.cpp with Vulkan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev glslc spirv-headers libssl-dev

      - name: Install Vulkan SDK on Windows
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          cache: true
          stripdown: true

      - name: Clone source repository
        run: git clone --depth 1 https://github.com/thecodacus/llama.cpp.git llama.cpp

      - name: Configure Linux build
        if: runner.os == 'Linux'
        run: cmake -S llama.cpp -B llama.cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON

      - name: Configure Windows build
        if: runner.os == 'Windows'
        run: cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON

      - name: Compile Linux
        if: runner.os == 'Linux'
        run: cmake --build llama.cpp/build --parallel 2

      - name: Compile Windows
        if: runner.os == 'Windows'
        run: cmake --build llama.cpp/build --config Release --parallel 2

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-vulkan-${{ matrix.artifact }}
          path: llama.cpp/build/bin/**
          if-no-files-found: error

